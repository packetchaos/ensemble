<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboards — navi Ensemble</title>
<link rel="stylesheet" href="/static/console.css">
<style>
/* ===== Dashboards app (build 509) — server-side boards, resizable + reorderable widgets ===== */
.dbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.dbar select,.dbar .btn{font-size:13px}
.dbar .grow{flex:1}
.dsel{font:600 14px var(--body);padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:280px}
.scopebar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin:0 0 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.scopebar .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.schip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 6px 4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;font-family:var(--body)}
.schip.not{border-color:var(--crit);color:var(--crit)}
.schip b{font-weight:700}
.schip .x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px;border-radius:50%}
.schip .x:hover{background:var(--line)}
.scopebar .cnt{font-size:12px;color:var(--ink-2);margin-left:auto}
.gridwrap{margin:0 auto}
.dgrid{display:grid;grid-template-columns:repeat(var(--cols,12),minmax(0,1fr));grid-auto-rows:var(--row,90px);gap:var(--gap,12px);position:relative}
.dgrid.dense{grid-auto-flow:row dense}
.wd{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wd:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wd.dragging{opacity:.4}
.wd.drop-before{box-shadow:-4px 0 0 0 var(--accent)}
.wd.drop-after{box-shadow:4px 0 0 0 var(--accent)}
.wd.resizing{outline:2px dashed var(--accent);outline-offset:-2px;z-index:5}
.wh{display:flex;align-items:center;gap:6px;padding:8px 10px 4px 8px;min-height:30px}
.wh h3{margin:0;font-size:13.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grab{cursor:grab;color:var(--ink-3);font-size:14px;padding:0 3px;border-radius:5px;user-select:none;line-height:1}
.grab:hover{color:var(--ink);background:var(--panel-2)}
.locked .grab,.locked .rsz{display:none}
.bdg{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.bdg.sc{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.bdg.fx{background:var(--panel-2);color:var(--accent2);border:1px solid var(--accent2)}
.bdg.ig{background:var(--warnbg,rgba(201,168,63,.15));color:var(--med)}
.bdg.st{background:var(--critbg,rgba(229,72,77,.12));color:var(--crit)}
.bdg.rv{background:var(--warnbg,rgba(201,168,63,.15));color:var(--med)}
.wb{flex:1;min-height:0;overflow:auto;padding:4px 12px 6px}
.wb svg{max-width:100%;max-height:calc(100% - 30px)}   /* charts fit the widget's height as well as its width */
.wd.stale .wb,.wd.db_changed .wb{opacity:.62}
.wf{display:flex;align-items:center;gap:6px;padding:4px 8px 6px 12px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.asof{font-size:11px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asof.warn{color:var(--med)}
.wf button,.wmini{font:600 11.5px var(--body);padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.wf button:hover,.wmini:hover{border-color:var(--accent)}
.wf button.sql{font-family:var(--mono)}
.wf button.more{font-size:14px;line-height:1;padding:2px 9px;color:var(--ink);font-weight:800}
.rsz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 50%,var(--ink-3) 50% 58%,transparent 58% 70%,var(--ink-3) 70% 78%,transparent 78%)}
.rsz:hover{background:linear-gradient(135deg,transparent 0 50%,var(--accent) 50% 58%,transparent 58% 70%,var(--accent) 70% 78%,transparent 78%)}
.szlbl{position:absolute;right:22px;bottom:4px;font:700 11px var(--mono);background:var(--accent);color:#fff;padding:2px 6px;border-radius:6px;pointer-events:none}
.wd-h{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;justify-content:flex-end}
.wd-h .wh{padding:0 4px 6px}
.wd-h h3{font-size:15px;font-weight:800;letter-spacing:.01em}
.wd-h .wf{display:none}
.kpiv{font-size:clamp(26px,3.2vw,44px);font-weight:800;line-height:1.05;color:var(--ink)}
.kpil{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.kpis{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;padding-top:4px}
.trend{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--ink-2)}
.trend svg{flex:0 0 auto}
.bdg.sn{background:var(--panel-2);color:var(--ink-2);border:1px dashed var(--line)}
.wstate{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;height:100%;font-size:12.5px;color:var(--ink-2)}
.wstate .err{color:var(--crit);font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:dsp 1s linear infinite;vertical-align:-2px}
@keyframes dsp{to{transform:rotate(360deg)}}
.note{font-size:11.5px;color:var(--ink-3);margin:0 0 4px}
.wmenu{position:fixed;z-index:200;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.wmenu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);padding:7px 9px;border-radius:7px;cursor:pointer;font:13px var(--body)}
.wmenu button:hover{background:var(--panel-2)}
.wmenu .sep{height:1px;background:var(--line);margin:5px 2px}
.wmenu .row{display:flex;gap:4px;padding:4px 6px;align-items:center;flex-wrap:wrap}
.wmenu .row button{width:auto;border:1px solid var(--line);padding:4px 8px;font-size:12px}
.wmenu .row .l{font-size:11px;color:var(--ink-3);width:54px}
.wmenu select{font:13px var(--body);padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.pop{position:fixed;z-index:210;width:min(380px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pop h4{margin:0 0 8px;font-size:13.5px}
.pop label{display:block;font-size:12px;color:var(--ink-2);margin:8px 0 4px}
.pop select,.pop input[type=text],.pop input[type=search]{width:100%;box-sizing:border-box;font:13px var(--body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.vlist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;padding:4px}
.vlist label{display:flex;gap:8px;align-items:center;margin:0;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--ink)}
.vlist label:hover{background:var(--panel-2)}
.vlist .n{margin-left:auto;font:11px var(--mono);color:var(--ink-3)}
.pop .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);color:var(--ink-2);padding:6px 10px;font:12px var(--body);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.tray{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:150;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s}
.tray.open{transform:none}
.tray header{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.tray header h2{margin:0;font-size:16px;flex:1}
.tray .tabsr{display:flex;gap:4px;padding:0 14px 8px;flex-wrap:wrap}
.tray .tabsr button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);padding:5px 10px;border-radius:999px;font:12.5px var(--body);cursor:pointer}
.tray .tabsr button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tray .search{padding:0 14px 8px}
.tray .search input{width:100%;box-sizing:border-box;font:13px var(--body);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.tray .list{flex:1;overflow:auto;padding:0 14px 20px}
.lgrp{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.litem{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start;background:var(--panel-2)}
.litem .t{font-weight:700;font-size:13px}
.litem .d{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.litem .m{font-size:10.5px;color:var(--ink-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.litem .m span{border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.litem .add{margin-left:auto;flex:0 0 auto}
.modal-bg{position:fixed;inset:0;z-index:300;background:rgba(5,7,12,.6);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(1100px,100%);padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .mh{display:flex;gap:10px;align-items:flex-start}
.modal .mh .grow{flex:1;min-width:0}
.sqlpre{background:#14162a;color:#e8e9f7;border-radius:10px;padding:12px 14px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;margin:8px 0;max-height:46vh;overflow:auto}
.defl{font-size:12.5px;color:var(--ink-2);margin:4px 0;line-height:1.45}
.defl b{color:var(--ink)}
.dtab{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:10px}
.dtab table{width:100%;border-collapse:collapse;font-size:12.5px}
.dtab th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtab td{padding:5px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel-2);font-size:13px}
.banner.warn{border-color:var(--med)}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--ink-2)}
.edtx textarea{width:100%;box-sizing:border-box;min-height:200px;font:12.5px/1.5 var(--mono);padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.edtx .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.edtx label{display:block;font-size:12px;color:var(--ink-2);margin:8px 0 3px}
.edtx input,.edtx select{width:100%;box-sizing:border-box;font:13px var(--body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
.aibox{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:11px;padding:10px 12px;margin:10px 0 4px;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.aibox label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}
.airow{display:flex;gap:8px;align-items:stretch}
.airow textarea{flex:1;font:13px var(--body);padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);resize:vertical}
.aiex{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pvw{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;max-height:52vh;overflow:auto}
.pvc{margin:6px 0}
.others{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--ink-3);align-items:center}
.others a{font-size:12px}
@media (max-width:760px){
  .dgrid{grid-template-columns:1fr!important;grid-auto-rows:auto!important}
  .wd{grid-column:1/-1!important;grid-row:auto!important;min-height:150px}
  .wd-h{min-height:0}
  .rsz,.grab{display:none}
  .scopebar .cnt{margin-left:0;width:100%}
}
</style>
</head><body data-page-cache="off">
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="hcrest brand" role="img" aria-label="navi Ensemble"></span></div>
    <h1>Dashboards <small>BOARDS · WIDGETS · SCOPE</small></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="banners"></div>

  <div class="dbar">
    <select class="dsel" id="bsel" aria-label="Board"></select>
    <button class="btn sm" id="bmenu" title="New, duplicate, rename, export, import, delete">Board ▾</button>
    <button class="btn sm" id="bsize" title="Columns, row height, width and spacing of this board">⚙ Board size</button>
    <button class="btn sm" id="block" title="Lock the layout so widgets can't be moved or resized by accident">🔓 Layout unlocked</button>
    <span class="grow"></span>
    <button class="btn sm" id="askai" title="Describe a widget in plain English — the model writes the SQL on the shared definitions">✨ Ask AI</button>
    <button class="btn sm" id="addw">＋ Add widget</button>
    <button class="btn run sm" id="runstale" title="Run every widget that hasn't run for this scope, is over a day old, or ran before the last navi.db sync">▶ Run stale</button>
    <button class="btn sm" id="runall" title="Re-run every widget on this board now">↻ Run all</button>
  </div>

  <div class="scopebar" id="scopebar" role="region" aria-label="Board scope"></div>

  <div class="gridwrap" id="gridwrap"><div class="dgrid" id="grid" aria-live="polite"></div></div>


  <footer>Dashboards · boards are saved on this server · every widget shows its SQL and opens its rows · nothing runs until you press ▶</footer>
</div>

<aside class="tray" id="tray" aria-label="Widget library" aria-hidden="true">
  <header><h2>Widget library</h2><button class="btn sm" id="newsql">＋ New SQL widget</button><button class="btn ghost sm" id="trayx" aria-label="Close">✕</button></header>
  <div class="tabsr" id="ltabs"></div>
  <div class="search"><input type="search" id="lq" placeholder="Search widgets…" aria-label="Search widgets"></div>
  <div class="list" id="llist"></div>
</aside>

<script src="/static/brand.js"></script>
<script src="/static/console.js"></script>
<script src="/static/dashviz.js"></script>
<script>
'use strict';
const API = a => '/api/dashboard/'+a;
const call = (a, b) => jpost(API(a), b||{});
let BOARDS=[], TEMPLATES=[], B=null, DEFS={}, RES={}, RUNNING={}, SCOPE_N=null, LIB=null, LTAB='presets';
let LOCKED=false; try{ LOCKED = localStorage.getItem('houndsDashLocked')==='1'; }catch(e){}
const GAPS={compact:6, comfortable:12, spacious:18};
const VIZ=['kpi','bar','column','stacked','grouped','pie','donut','line','area','combo','scatter','bubble','heatmap','treemap','funnel','waterfall','radar','gauge','progress','histogram','table'];
const fmtN = n => (typeof n==='number' ? n.toLocaleString() : esc(String(n==null?'':n)));
const qs = (k) => { try{ return new URLSearchParams(location.search).get(k)||''; }catch(e){ return ''; } };
function ago(t){ if(!t) return ''; const s=Math.max(0,(Date.now()/1000)-t); if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return Math.round(s/86400)+' d ago'; }
function stamp(t){ try{ return new Date(t*1000).toLocaleString(); }catch(e){ return ''; } }

/* ---------- load ---------- */
async function loadBoards(pick){
  const o = await call('boards');
  if(!o || !o.ok){ document.getElementById('grid').innerHTML='<div class="empty">Could not load boards — '+esc((o&&o.error)||'server error')+'</div>'; return; }
  BOARDS=o.boards||[]; TEMPLATES=o.templates||[];
  // ?template=compliance|certificates — open that templated board (made once, on first visit)
  const tpl = !pick && qs('template');
  if(tpl && TEMPLATES.some(t=>t.id===tpl) && tpl!=='blank'){
    const have=BOARDS.find(b=>b.kind==='template:'+tpl);
    if(have) return openBoard(have.id);
    const o=await call('board_new',{template:tpl}); if(o&&o.ok){ BOARDS.push({id:o.board.id, name:o.board.name, kind:o.board.kind, widgets:o.board.widgets.length}); return openBoard(o.board.id); }
  }
  const want = pick || qs('board') || ((BOARDS.find(b=>b.is_default)||BOARDS[0]||{}).id);
  await openBoard(want);
}
async function openBoard(id){
  const o = await call('board_get', {id});
  if(!o || !o.ok){ if(BOARDS[0] && id!==BOARDS[0].id) return openBoard(BOARDS[0].id); return; }
  B=o.board; DEFS=o.defs||{}; SCOPE_N=o.scope_assets; RES={};
  try{ const u=new URL(location.href); u.searchParams.set('board', B.id); u.searchParams.delete('template'); history.replaceState(null,'',u); }catch(e){}
  renderBar(); renderScope(); renderGrid();
  await loadCached();
}
async function loadCached(){
  if(!B) return;
  const o = await call('widget_cached', {board:B.id});
  if(o && o.ok){ RES=o.results||{}; }
  renderGrid();
}

/* ---------- save (debounced, optimistic rev) ---------- */
let _saveT=null, _saving=null;
function saveSoon(ms){ clearTimeout(_saveT); _saveT=setTimeout(saveNow, ms==null?350:ms); }
async function saveNow(){
  clearTimeout(_saveT); if(!B) return;
  const body={id:B.id, rev:B.rev, name:B.name, layout:B.layout, scope:B.scope, widgets:B.widgets};
  _saving = call('board_save', {board:body});
  const o = await _saving; _saving=null;
  if(o && o.ok){ const keep=B.widgets; B=o.board; DEFS=Object.assign(DEFS, o.defs||{}); SCOPE_N=o.scope_assets;
    // the server may assign iids to new widgets — map results across by position
    const old={}; keep.forEach((w,i)=>{ old[i]=w.iid; });
    B.widgets.forEach((w,i)=>{ if(old[i] && old[i]!==w.iid && RES[old[i]]){ RES[w.iid]=RES[old[i]]; } });
    const bi=BOARDS.find(x=>x.id===B.id); if(bi){ bi.name=B.name; bi.widgets=B.widgets.length; }
    renderBar(); renderScopeCount(); return true; }
  if(o && o.conflict){ banner('This board was changed in another tab or by someone else. <button class="btn sm" id="reloadB">Reload it</button>', 'warn', 'conflict');
    const r=document.getElementById('reloadB'); if(r) r.onclick=()=>{ clearBanner('conflict'); openBoard(B.id); }; return false; }
  banner('Could not save the board — '+esc((o&&o.error)||'server error'), 'warn', 'save'); return false;
}

/* ---------- banners ---------- */
function banner(html, cls, key){ const el=document.getElementById('banners'); clearBanner(key);
  const d=document.createElement('div'); d.className='banner '+(cls||''); d.dataset.key=key||''; d.innerHTML=html; el.appendChild(d); return d; }
function clearBanner(key){ document.querySelectorAll('#banners .banner').forEach(b=>{ if(!key || b.dataset.key===key) b.remove(); }); }

/* ---------- top bar ---------- */
function renderBar(){
  const s=document.getElementById('bsel');
  s.innerHTML = BOARDS.map(b=>'<option value="'+esc(b.id)+'"'+(B&&b.id===B.id?' selected':'')+'>'+(b.is_default?'★ ':'')+esc(b.name)+' ('+b.widgets+')</option>').join('');
  s.onchange = ()=>openBoard(s.value);
  const lk=document.getElementById('block'); lk.textContent = LOCKED ? '🔒 Layout locked' : '🔓 Layout unlocked';
  document.getElementById('grid').classList.toggle('locked', LOCKED);
  const n = staleIds().length; const rs=document.getElementById('runstale');
  rs.textContent = '▶ Run stale' + (n ? ' ('+n+')' : ''); rs.disabled = !n;
  const m=document.getElementById('meta'); if(m) m.innerHTML = B ? '<span class="chip">'+esc(B.widgets.length)+' widget'+(B.widgets.length===1?'':'s')+'</span>' : '';
}

/* ---------- scope bar ---------- */
function scopeTerms(){ return (B && B.scope && B.scope.terms) || []; }
function renderScope(){
  const el=document.getElementById('scopebar'); const t=scopeTerms();
  el.innerHTML = '<span class="lbl">Scope</span>'
    + (t.length ? t.map((x,i)=>'<span class="schip'+(x.op==='not'?' not':'')+'" data-i="'+i+'" role="button" tabindex="0" title="Edit this filter">'

function gridMetrics(){ const g=document.getElementById('grid'); const L=B.layout||{}; const cols=L.cols||12; const gap=GAPS[L.gap]||12;
  const W=g.clientWidth; return {cols, gap, colW:(W-gap*(cols-1))/cols, rowH:(L.row||90)}; }
function resizeStart(e, el){

    if(a==='rename'){ const v=prompt(isH?'Section title':'Widget title', isH?(w.text||''):(w.title||d.title||'')); if(v==null) return;
      if(isH) w.text=v.trim()||'Section'; else { if(v.trim()) w.title=v.trim(); else delete w.title; } renderGrid(); saveSoon(); }
    else if(a==='pin'){ w.scope=JSON.parse(JSON.stringify(B.scope||{terms:[]})); await saveNow(); await loadCached(); }
    else if(a==='unpin'){ delete w.scope; await saveNow(); await loadCached(); }
    else if(a==='open'){ location.href=d.source.page; }
    else if(a==='editsql'){ editSql(w.ref); }
    else if(a==='csv'){ exportCsv(iid); }
    else if(a==='dup'){ const c=JSON.parse(JSON.stringify(w)); delete c.iid; const i=B.widgets.indexOf(w); B.widgets.splice(i+1,0,c); renderGrid(); await saveNow(); await loadCached(); }
    else if(a==='remove'){ if(!confirm('Remove “'+(isH?(w.text||'section'):(w.title||d.title))+'” from this board?')) return; B.widgets=B.widgets.filter(x=>x!==w); delete RES[iid]; renderGrid(); saveSoon(0); }
  });
}

/* ---------- running (explicit only) ---------- */
let QUEUE=[], ACTIVE=0; const CONC=2;
function runWidgets(ids, refresh){
  ids.forEach(id=>{ if(!RUNNING[id] && !QUEUE.some(q=>q.id===id)) { QUEUE.push({id, refresh:!!refresh}); RUNNING[id]=true; } });
  renderGrid(); pump();
}
async function pump(){
  while(ACTIVE<CONC && QUEUE.length){ const job=QUEUE.shift(); ACTIVE++;
    (async()=>{ let o; try{ o=await call('widget_run', {board:B.id, iid:job.id, refresh:job.refresh}); }catch(e){ o={ok:false, error:String(e)}; }
      delete RUNNING[job.id];
      if(o && o.ok) RES[job.id]=o.result;
      else if(o && o.review) RES[job.id]={state:'review'};
      else RES[job.id]=Object.assign({}, RES[job.id]||{}, {state:'error', error:(o&&(o.message||o.error))||'failed'});
      ACTIVE--; const el=document.querySelector('.wd[data-iid="'+CSS.escape(job.id)+'"]');
      const w=B.widgets.find(x=>x.iid===job.id);
      if(el && w){ el.outerHTML=cardHtml(w); const n=document.querySelector('.wd[data-iid="'+CSS.escape(job.id)+'"]'); if(n) wireCard(n); }
      renderBar(); pump(); })();
  }
}

  closePops(); const m=document.createElement('div'); m.className='wmenu'; m.id='__wmenu';
  m.innerHTML='<div class="row"><span class="l">New</span><select id="ntpl">'+TEMPLATES.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.id==='blank'?'Blank board':t.name)+'</option>').join('')+'</select><button id="nmk">Create</button></div>'
    +'<button data-a="rename">✎ Rename board</button><button data-a="dup">⧉ Duplicate board</button>'
    +(B.is_default?'':'<button data-a="default">★ Make this my landing board</button>')
    +'<div class="sep"></div><button data-a="export">⬇ Export (definitions only)</button><button data-a="import">⤒ Import a board…</button>'
    +'<div class="sep"></div><button data-a="delete" style="color:var(--crit)">🗑 Delete board</button>';
  document.body.appendChild(m); placePop(m, e.currentTarget);
  document.getElementById('nmk').onclick=async()=>{ const t=document.getElementById('ntpl').value; const name=prompt('Board name', t==='blank'?'New board':(TEMPLATES.find(x=>x.id===t)||{}).name); if(name==null) return; closePops();
    const o=await call('board_new',{template:t, name:name.trim()||undefined}); if(o&&o.ok) loadBoards(o.board.id); else alert((o&&o.error)||'Could not create.'); };
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{ const a=b.dataset.a; closePops();
    if(a==='rename'){ const v=prompt('Board name', B.name); if(v&&v.trim()){ B.name=v.trim(); await saveNow(); } }
    else if(a==='dup'){ const o=await call('board_new',{copy_of:B.id}); if(o&&o.ok) loadBoards(o.board.id); }
    else if(a==='default'){ const o=await call('board_default',{id:B.id}); if(o&&o.ok) loadBoards(B.id); }
    else if(a==='export'){ const o=await call('board_export',{id:B.id}); if(o&&o.ok) downloadText((B.name||'board').replace(/[^\w\- ]+/g,'_')+'.board.json', JSON.stringify(o.doc,null,2)); }
    else if(a==='import'){ const f=document.createElement('input'); f.type='file'; f.accept='.json,application/json'; f.onchange=async()=>{ const file=f.files[0]; if(!file) return;
        let doc; try{ doc=JSON.parse(await file.text()); }catch(e){ alert('That file is not JSON.'); return; }
        const o=await call('board_import',{doc}); if(o&&o.ok){ await loadBoards(o.board.id); banner('Imported “'+esc(o.board.name)+'”. Any SQL it brought is marked <b>needs review</b> — open { } SQL to read and approve it before it runs.', '', 'imp'); }
        else alert('Import failed — '+((o&&o.error)||'error')); }; f.click(); }
    else if(a==='delete'){ if(!confirm('Delete the board “'+B.name+'”? Its widgets stay in the library.')) return; const o=await call('board_delete',{id:B.id}); if(o&&o.ok) loadBoards(); }
  });
};
document.getElementById('bsize').onclick=e=>{
  closePops(); const L=Object.assign({cols:12,row:90,maxw:0,gap:'comfortable',dense:true}, B.layout||{});
  const p=document.createElement('div'); p.className='pop'; p.id='__pop';
  p.innerHTML='<h4>Board size</h4>'
    +'<label for="lc">Columns</label><select id="lc">'+[4,6,8,12,16,24].map(c=>'<option'+(c===L.cols?' selected':'')+'>'+c+'</option>').join('')+'</select>'
    +'<label for="lr">Row height — <b id="lrv">'+L.row+' px</b></label><input type="range" id="lr" min="40" max="240" step="10" value="'+L.row+'" style="width:100%">'
    +'<label for="lw">Board width</label><select id="lw">'+[[0,'Full width'],[1920,'1920 px'],[1600,'1600 px'],[1280,'1280 px'],[1024,'1024 px']].map(o=>'<option value="'+o[0]+'"'+(o[0]===L.maxw?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'
    +'<label>Spacing</label><div class="seg" id="lg">'+['compact','comfortable','spacious'].map(g=>'<button data-g="'+g+'" class="'+(g===L.gap?'on':'')+'">'+g+'</button>').join('')+'</div>'
    +'<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="ld"'+(L.dense!==false?' checked':'')+'> Fill gaps (pack smaller widgets into empty space)</label>'
    +'<label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="ldaily"'+(L.daily?' checked':'')+'> 📅 Snapshot this board\'s numbers once a day (builds the trend lines)</label>'
    +'<p class="note" style="margin-top:8px">Changing the columns rescales every widget\'s width. Saved with the board for everyone who opens it.</p>'
    +'<div class="acts"><button class="btn run sm" id="ldone">Done</button></div>';
  document.body.appendChild(p); placePop(p, e.currentTarget);
  const apply=()=>{ renderGrid(); saveSoon(500); };
  p.querySelector('#lc').onchange=ev=>{ const nc=+ev.target.value, oc=B.layout.cols||12; B.layout.cols=nc;
    B.widgets.forEach(w=>{ w.w = w.ref==='text.heading' ? nc : Math.max(1, Math.min(nc, Math.round((w.w||3)*nc/oc))); }); apply(); };
  p.querySelector('#lr').oninput=ev=>{ B.layout.row=+ev.target.value; p.querySelector('#lrv').textContent=ev.target.value+' px'; applyLayout(); saveSoon(500); };
  p.querySelector('#lw').onchange=ev=>{ B.layout.maxw=+ev.target.value; apply(); };
  p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ B.layout.gap=b.dataset.g; p.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b)); apply(); });
  p.querySelector('#ld').onchange=ev=>{ B.layout.dense=ev.target.checked; apply(); };
  p.querySelector('#ldaily').onchange=ev=>{ B.layout.daily=ev.target.checked; saveSoon(200); };
  p.querySelector('#ldone').onclick=closePops;
};
document.getElementById('block').onclick=()=>{ LOCKED=!LOCKED; try{ localStorage.setItem('houndsDashLocked', LOCKED?'1':'0'); }catch(e){} renderBar(); };

/* ---------- bring browser boards (localStorage) to the server, once, on request ---------- */
function offerMigration(){
  let st=null; try{ st=JSON.parse(localStorage.getItem('navi-dashboards')||'null'); }catch(e){}
  let done=false; try{ done=localStorage.getItem('houndsDashMigrated')==='1'; }catch(e){}
  const list=((st&&st.list)||[]).filter(b=>(b.items||[]).some(i=>i&&String(i.sql||'').trim()));
  if(done || !list.length) return;
  const d=banner('You have <b>'+list.length+'</b> board'+(list.length===1?'':'s')+' saved only in this browser (the old Custom Dashboard). <button class="btn run sm" id="mig">Move them to the server</button> <button class="btn ghost sm" id="migx">Not now</button>', '', 'mig');
  d.querySelector('#migx').onclick=()=>{ try{ localStorage.setItem('houndsDashMigrated','1'); }catch(e){} clearBanner('mig'); };
  d.querySelector('#mig').onclick=async()=>{ let n=0, last=null;
    for(const b of list){ const o=await call('board_import',{doc:{name:b.name, items:b.items}, origin:'browser'}); if(o&&o.ok){ n++; last=o.board.id; } }
    try{ localStorage.setItem('houndsDashMigrated','1'); }catch(e){} clearBanner('mig');
    banner('Moved '+n+' board'+(n===1?'':'s')+' to the server. The old Custom Dashboard still has its copy.', '', 'migd'); if(last) loadBoards(last); };
}

loadBoards().then(offerMigration);
</script>
